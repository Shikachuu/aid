name: Release

run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Build binaries and write the changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag format
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::release tag $TAG must look like vX.Y.Z"; exit 1; }'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Run the merge gate
        run: bun run check

      - name: Set the package version from the tag
        run: |
          VERSION="${TAG#v}" bun -e '
            const pkg = await Bun.file("package.json").json()
            pkg.version = process.env.VERSION
            await Bun.write("package.json", JSON.stringify(pkg, null, 2) + "\n")
          '

      - name: Compile every target
        run: bun run build

      - name: Check the embedded version
        run: test "$(./dist/bin/aid-linux-x64 --version)" = "${TAG#v}"

      - name: Write checksums
        working-directory: dist/bin
        run: sha256sum aid-* > SHA256SUMS

      - name: Upload the binaries
        run: gh release upload "$TAG" dist/bin/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate the changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: release-notes.md

      - name: Write the changelog into the release
        run: gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
