name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Binary and runtime drift
        run: bun run deps:binaries --offline

      - name: Schema parity (zod ↔ schemas/aid.schema.json)
        run: bun run scripts/emit-schema.ts --check

      - name: Docs reference parity
        run: bun run gen-docs --check

      - name: Build docs site
        run: bun run docs:build

      - name: Lint docs
        run: bun run docs:lint

      - name: Docs pages to review
        if: github.event_name == 'pull_request'
        run: bun run docs:affected --base HEAD^1 --github
