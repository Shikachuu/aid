name: CI

run-name: "${{ github.event_name == 'pull_request' && format('CI (PR #{0}) {1}', github.event.pull_request.number, github.event.pull_request.title) || format('CI ({0}) {1}', github.ref_name, github.sha) }}"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1844125a3fb50181c107d7d2df15f124
  PAGES_PROJECT: shikachuu-aid
  WRANGLER_VERSION: 4.158.0

jobs:
  check:
    name: Test, typecheck, lint, format
    runs-on: ubuntu-latest
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run the merge gate
        run: bun run check

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(bun -e 'console.log(require("playwright/package.json").version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Run the e2e tests
        run: bun run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: tests/e2e/__screenshots__
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build the binary and the docs site
    runs-on: ubuntu-latest
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Compile the linux-x64 binary
        run: bun run build --target linux-x64

      - name: Build the docs site with the binary
        run: ./dist/bin/aid-linux-x64 build docs --clean

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aid-linux-x64
          path: dist/bin/aid-linux-x64
          retention-days: 14
          if-no-files-found: error

      - name: Upload the docs site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/dist
          retention-days: 14
          if-no-files-found: error

  deploy-docs:
    name: Deploy the docs site
    needs: [check, e2e, build]
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    concurrency:
      group: docs-deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      PAGES_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Read the pull request state
        id: pr
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pr.outputs.state != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        if: steps.pr.outputs.state != 'closed'
        uses: ./.github/actions/setup

      - name: Download the docs site
        if: steps.pr.outputs.state != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site

      - name: Deploy to Cloudflare Pages
        if: steps.pr.outputs.state != 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun x "wrangler@$WRANGLER_VERSION" pages deploy site --project-name="$PAGES_PROJECT" --branch="$PAGES_BRANCH" --commit-hash="$COMMIT_SHA"

      - name: Link the deployment on GitHub
        if: steps.pr.outputs.state != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PAGES_BRANCH" = main ]; then
            url="https://$PAGES_PROJECT.pages.dev"
            transient=false
          else
            url="https://$PAGES_BRANCH.$PAGES_PROJECT.pages.dev"
            transient=true
          fi
          id=$(jq -n --arg ref "$COMMIT_SHA" --arg env "docs ($PAGES_BRANCH)" --argjson transient "$transient" \
            '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [], transient_environment: $transient, production_environment: ($transient | not)}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success -f environment_url="$url" > /dev/null
          echo "Docs deployed to $url" >> "$GITHUB_STEP_SUMMARY"
