name: Docs preview cleanup

run-name: "Docs preview cleanup (PR #${{ github.event.pull_request.number }}) ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1844125a3fb50181c107d7d2df15f124
  PAGES_PROJECT: shikachuu-aid

jobs:
  cleanup:
    name: Delete the docs preview
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: docs-deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete the Cloudflare Pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments"
          ids=()
          page=1
          while :; do
            body=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?env=preview&per_page=25&page=$page")
            jq -e .success <<< "$body" > /dev/null
            page_ids=$(jq -r --arg branch "$PAGES_BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' <<< "$body")
            [ -z "$page_ids" ] || mapfile -t -O "${#ids[@]}" ids <<< "$page_ids"
            more=$(jq '.result_info | .page * .per_page < .total_count' <<< "$body")
            [ "$more" = true ] || break
            page=$((page + 1))
          done
          for id in "${ids[@]}"; do
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$id?force=true" > /dev/null
          done
          echo "Deleted ${#ids[@]} Cloudflare Pages deployments for $PAGES_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Deactivate the GitHub deployments
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments" -X GET -f environment="docs ($PAGES_BRANCH)" --paginate --jq '.[].id')
          for id in $ids; do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive > /dev/null
          done
          echo "Deactivated $(wc -w <<< "$ids") GitHub deployments for docs ($PAGES_BRANCH)" >> "$GITHUB_STEP_SUMMARY"
