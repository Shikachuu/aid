name: Setup
description: Install the mise toolchain, every platform package, the staged natives, and proto-ui

inputs:
  cache:
    description: Restore and save the mise and Bun caches. Turn off in release jobs.
    default: "true"

runs:
  using: composite
  steps:
    - name: Cache Bun packages
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install mise tools and dependencies
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: ${{ inputs.cache }}
