[tools."http:bun"]
version = "1.4.4-canary.20261103.1"
bin_path = "package/bin"

[tools."http:bun".platforms]
macos-arm64 = { url = "https://registry.npmjs.org/@oven/bun-darwin-aarch64/-/bun-darwin-aarch64-{{ version }}.tgz" }
macos-x64 = { url = "https://registry.npmjs.org/@oven/bun-darwin-x64/-/bun-darwin-x64-{{ version }}.tgz" }
linux-arm64 = { url = "https://registry.npmjs.org/@oven/bun-linux-aarch64/-/bun-linux-aarch64-{{ version }}.tgz" }
linux-x64 = { url = "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-{{ version }}.tgz" }

[tools]
"github:DeusData/codebase-memory-mcp" = "0.12.1"
actionlint = "1"
shellcheck = "0.11"

[settings]
experimental = true

[hooks]
postinstall = "bun install --cpu='*' --os='*' ${CI:+--frozen-lockfile} && bun scripts/stage-natives.ts && bun run -F @aid/proto-ui build && { [ -n \"$CI\" ] || codebase-memory-mcp cli --quiet index_repository --repo-path \"$MISE_PROJECT_ROOT\" >/dev/null; }"
